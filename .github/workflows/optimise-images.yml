# Still Sonic Media - automatic photo optimiser
# Whenever a photo is uploaded to photos/<page>/ (or the repo root), this runs
# tools/optimise_images.py on GitHub's servers and commits the result
# (phone-sized WebP copies in img/, updated srcset on pages, img/manifest.js).
# Nothing to run yourself. Check progress under the repo's "Actions" tab.
name: Optimise images

on:
  push:
    branches: [main]
    paths:
      - 'photos/**'
      - '*.jpg'
      - '*.jpeg'
      - '*.JPG'
      - '*.JPEG'
      - '*.png'
      - '*.PNG'
      - '*.html'
      - 'tools/optimise_images.py'
      - '.github/workflows/optimise-images.yml'
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: optimise-images
  cancel-in-progress: false

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Make phone-sized images
        run: python3 tools/optimise_images.py

      - name: Commit results
        run: |
          git config user.name "ssm-image-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to optimise."
          else
            git commit -m "Optimise images (automatic)"
            git push
          fi
