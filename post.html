<!-- Always load the latest posts and photo list (skips the browser's cached copy) -->
<script>(function(){var t=Date.now();document.write('<script src="img/manifest.js?t='+t+'"><\/script><script src="blog-posts.js?t='+t+'"><\/script>');})();</script>
<script>
  /* Shared helpers for the blog pages */
  var POSTS = (window.SSM_POSTS || []).filter(function (p) { return p && p.slug && !p.draft; })
    .sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
  var TYPE_NAMES = { 'image': 'Photo', 'text': 'Words', 'image-text': 'Story' };
  function fmtDate(d) {
    if (!d) return '';
    var dt = new Date(d + 'T12:00:00');
    return isNaN(dt) ? d : dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function plain(html) { var d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent || ''; }
  function excerptOf(p) {
    if (p.excerpt) return p.excerpt;
    var first = plain((p.body || [])[0] || p.caption || '');
    return first.length > 180 ? first.slice(0, 177).replace(/\s+\S*$/, '') + '\u2026' : first;
  }
  /* Smaller WebP sizes + real dimensions, when tools/optimise_images.py has made them */
  function imgAttrs(file, sizes) {
    var m = (window.SSM_IMAGES || {})[file];
    if (!m) return '';
    return ' srcset="' + esc(m.srcset) + '" sizes="' + sizes + '" width="' + m.w + '" height="' + m.h + '" decoding="async"';
  }
  function metaHTML(p) {
    return '<div class="post-meta"><span class="tag">' + esc(p.tag || TYPE_NAMES[p.type] || 'Post') + '</span><span class="dot"></span><time datetime="' + esc(p.date) + '">' + esc(fmtDate(p.date)) + '</time></div>';
  }

  /* Find the post named in the address (post.html?p=slug) and draw it. */
  var slug = new URLSearchParams(location.search).get('p');
  var idx = -1;
  for (var i = 0; i < POSTS.length; i++) if (POSTS[i].slug === slug) idx = i;
  var root = document.getElementById('postRoot');

  if (idx < 0) {
    root.innerHTML = '<div class="post-missing"><h1>Post not found</h1><p>It may have moved. <a href="blog.html">See all posts</a>.</p></div>';
    document.title = 'Post not found \u2014 Still Sonic Media';
  } else {
    var p = POSTS[idx];
    var type = p.type === 'image' || p.type === 'text' ? p.type : 'image-text';
    var header = '<header class="post-header">' + metaHTML(p) + '<h1 class="post-title">' + esc(p.title) + '</h1></header>';
    var figure = p.image ? '<figure class="post-figure"><img id="postImg" fetchpriority="high" src="' + esc(p.image) + '"' + imgAttrs(p.image, '(max-width: 1240px) 100vw, 1200px') + ((window.SSM_IMAGES || {})[p.image] ? ' style="--ar: ' + window.SSM_IMAGES[p.image].w + ' / ' + window.SSM_IMAGES[p.image].h + '"' : '') + ' alt="' + esc(p.imageAlt || p.title) + '" />' +
      (p.caption ? '<figcaption>' + p.caption + '</figcaption>' : '') + '</figure>' : '';
    var body = (p.body && p.body.length) ? '<div class="post-body">' + p.body.map(function (para) { return '<p>' + String(para).replace(/\n/g, '<br>') + '</p>'; }).join('') + '</div>' : '';

    /* Newer / older links (list is newest first) */
    var newer = POSTS[idx - 1], older = POSTS[idx + 1];
    var nav = (newer || older) ? '<div class="post-nav" role="navigation" aria-label="More posts">' +
      (older ? '<a class="prev" href="post.html?p=' + encodeURIComponent(older.slug) + '"><span class="label">&#8592; Older</span><div class="title">' + esc(older.title) + '</div></a>' : '') +
      (newer ? '<a class="next" href="post.html?p=' + encodeURIComponent(newer.slug) + '"><span class="label">Newer &#8594;</span><div class="title">' + esc(newer.title) + '</div></a>' : '') +
      '</div>' : '';

    var inner = type === 'image' ? figure + header + body
              : type === 'text'  ? header + body
              : header + figure + body;
    root.innerHTML = '<article class="post post--' + type + '">' + inner + nav + '</article>';

    /* Page title + description for sharing and the browser tab */
    var desc = excerptOf(p);
    document.title = p.title + ' \u2014 Still Sonic Media';
    document.querySelector('meta[name="description"]').setAttribute('content', desc);
    document.querySelector('meta[property="og:title"]').setAttribute('content', p.title + ' \u2014 Still Sonic Media');
    if (p.image) document.querySelector('meta[property="og:image"]').setAttribute('content', 'https://stillsonicmedia.co.uk/' + p.image);

    /* Click the photo to view it full screen */
    var img = document.getElementById('postImg'), lb = document.getElementById('lightbox'), lbImg = document.getElementById('lbImg');
    function closeLb() { lb.classList.remove('active'); document.body.style.overflow = ''; }
    if (img) img.addEventListener('click', function () { lbImg.src = img.src; lbImg.alt = img.alt; lb.classList.add('active'); document.body.style.overflow = 'hidden'; });
    document.getElementById('lbClose').addEventListener('click', closeLb);
    lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLb(); });
  }
</script>
