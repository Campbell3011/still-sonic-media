<script src="blog-posts.js?v=1"></script>
<script>
  /* Shared helpers for the blog pages */
  var POSTS = (window.SSM_POSTS || []).filter(function (p) { return p && p.slug && !p.draft; })
    .sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });
  var TYPE_NAMES = { 'image': 'Photo', 'text': 'Words', 'image-text': 'Story' };
  function fmtDate(d) {
    if (!d) return '';
    var dt = new Date(d + 'T12:00:00');
    return isNaN(dt) ? d : dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function plain(html) { var d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent || ''; }
  function excerptOf(p) {
    if (p.excerpt) return p.excerpt;
    var first = plain((p.body || [])[0] || p.caption || '');
    return first.length > 180 ? first.slice(0, 177).replace(/\s+\S*$/, '') + '\u2026' : first;
  }
  function metaHTML(p) {
    return '<div class="post-meta"><span class="tag">' + esc(p.tag || TYPE_NAMES[p.type] || 'Post') + '</span><span class="dot"></span><time datetime="' + esc(p.date) + '">' + esc(fmtDate(p.date)) + '</time></div>';
  }

  /* Build one card per post. Runs before site.js so the cursor and page
     transitions pick the cards up like any other link. */
  var grid = document.getElementById('blogGrid');
  var empty = document.getElementById('blogEmpty');
  grid.innerHTML = POSTS.map(function (p) {
    var href = 'post.html?p=' + encodeURIComponent(p.slug);
    var img = p.image ? '<div class="post-card-img"><img src="' + esc(p.image) + '" alt="' + esc(p.imageAlt || p.title) + '" loading="lazy" /></div>' : '';
    if (p.type === 'image') {
      return '<a class="post-card post-card--image" data-type="image" href="' + href + '">' + img +
        '<div class="post-card-overlay">' + metaHTML(p) + '<h2 class="post-card-title">' + esc(p.title) + '</h2></div></a>';
    }
    var isText = p.type === 'text';
    return '<a class="post-card ' + (isText ? 'post-card--text' : 'post-card--story') + '" data-type="' + (isText ? 'text' : 'image-text') + '" href="' + href + '">' +
      (isText ? '' : img) +
      '<div class="post-card-body">' + metaHTML(p) + '<h2 class="post-card-title">' + esc(p.title) + '</h2>' +
      '<p class="post-card-excerpt">' + esc(excerptOf(p)) + '</p><span class="read-more">Read &#8594;</span></div></a>';
  }).join('');
  empty.hidden = POSTS.length > 0;

  /* Filter buttons */
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.blog-filter'));
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.post-card'));
  function applyFilter(type) {
    var shown = 0;
    cards.forEach(function (c) {
      var match = type === 'all' || c.getAttribute('data-type') === type;
      c.classList.toggle('is-hidden', !match);
      if (match) shown++;
    });
    empty.hidden = shown > 0;
    buttons.forEach(function (b) {
      var on = b.getAttribute('data-filter') === type;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (window.ScrollTrigger) ScrollTrigger.refresh();
  }
  buttons.forEach(function (b) { b.addEventListener('click', function () { applyFilter(b.getAttribute('data-filter')); }); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="site.js?v=2"></script>

</script>
